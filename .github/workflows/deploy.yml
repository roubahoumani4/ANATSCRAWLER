name: Production Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build (client + server)
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.js
          test -d client/dist

      - name: Package release
        run: |
          mkdir -p .release
          cp -r dist .release/dist
          mkdir -p .release/client
          cp -r client/dist .release/client/dist
          # Include server files
          mkdir -p .release/server
          # Copy only necessary server directories
          cp -r server/config server/lib server/middleware server/models server/routes server/services server/types server/utils .release/server/
          # Include SpiderFoot integration code
          mkdir -p .release/server/spiderfoot-4.0
          cp -r server/spiderfoot-4.0 .release/server/
          cp package.json .release/
          if [ -f package-lock.json ]; then cp package-lock.json .release/; fi
          cp ecosystem.config.cjs .release/
          tar -C .release -czf anatscrawler-release.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: anatscrawler-release
          path: anatscrawler-release.tar.gz
          if-no-files-found: error

  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Prepare remote base directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 5m
          script: |
            set -e
            sudo mkdir -p /var/www/anatscrawler/current /var/www/anatscrawler/logs /var/www/anatscrawler/data
            sudo chown -R $USER:$USER /var/www/anatscrawler

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: anatscrawler-release
          path: .

      - name: Upload package to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: "anatscrawler-release.tar.gz"
          target: "/var/www/anatscrawler/"

      - name: Activate release and restart PM2
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Core app secrets and backing services
          APP_PORT: ${{ secrets.APP_PORT }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          MONGODB_URL: ${{ secrets.MONGODB_URL }}
          ELASTICSEARCH_URL: ${{ secrets.ELASTICSEARCH_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          # Optional MISP integration
          MISP_URL: ${{ secrets.MISP_URL }}
          MISP_API_KEY: ${{ secrets.MISP_API_KEY }}
          MISP_VERIFY_TLS: ${{ secrets.MISP_VERIFY_TLS }}
          MISP_TIMEOUT_MS: ${{ secrets.MISP_TIMEOUT_MS }}
          # Frontend runtime hint (not strictly required)
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 10m
          envs: APP_PORT,JWT_SECRET,COOKIE_SECRET,MONGODB_URL,ELASTICSEARCH_URL,REDIS_URL,MISP_URL,MISP_API_KEY,MISP_VERIFY_TLS,MISP_TIMEOUT_MS,VITE_API_URL
          script: |
            set -e
            BASE_DIR=/var/www/anatscrawler
            RELEASE_TGZ=${BASE_DIR}/anatscrawler-release.tar.gz
            CURRENT_DIR=${BASE_DIR}/current

            echo "Preparing directories..."
            umask 022
            mkdir -p "${CURRENT_DIR}" "${BASE_DIR}/data" "${BASE_DIR}/data/backups" "${BASE_DIR}/logs"
            chmod -R 755 "${BASE_DIR}/data" "${BASE_DIR}/logs" || true
            mkdir -p /var/www/anatscrawler/logs || true
            chmod 755 /var/www/anatscrawler/logs || true
            echo "Installing Node.js if missing..."
            if ! command -v node >/dev/null 2>&1; then
              if command -v apt-get >/dev/null 2>&1; then
                curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
                sudo apt-get install -y nodejs
              elif command -v dnf >/dev/null 2>&1; then
                curl -fsSL https://rpm.nodesource.com/setup_20.x | sudo bash -
                sudo dnf install -y nodejs
              elif command -v yum >/dev/null 2>&1; then
                curl -fsSL https://rpm.nodesource.com/setup_20.x | sudo bash -
                sudo yum install -y nodejs
              fi
            fi

            # Ensure PM2 is available
            command -v pm2 >/dev/null 2>&1 || sudo npm i -g pm2

            echo "Stopping PM2 app (if running)..."
            pm2 stop anatscrawler || true

            echo "Extracting release into current..."
            rm -rf "${CURRENT_DIR:?}"/*
            tar -xzf "${RELEASE_TGZ}" -C "${CURRENT_DIR}"
            rm -f "${RELEASE_TGZ}"

            cd "${CURRENT_DIR}"

            echo "Installing base OS dependencies if missing (zero-touch)..."
            if command -v apt-get >/dev/null 2>&1; then
              sudo apt-get update -y || true
              sudo apt-get install -y python3 python3-venv python3-pip curl tar gzip || true
            elif command -v dnf >/dev/null 2>&1; then
              sudo dnf install -y python3 python3-venv python3-pip curl tar gzip || true
            elif command -v yum >/dev/null 2>&1; then
              sudo yum install -y python3 python3-venv python3-pip curl tar gzip || true
            fi

            echo "Installing runtime dependencies (prod only)..."
            if [ -f package-lock.json ]; then
              npm ci --omit=dev --no-audit --no-fund
            else
              npm install --omit=dev --no-audit --no-fund
            fi

            echo "Preparing SpiderFoot runtime (venv + requirements)..."
            SF_DIR="${CURRENT_DIR}/server/spiderfoot-4.0"
            if [ -d "$SF_DIR" ]; then
              # Create venv if not present
              if [ ! -d "$SF_DIR/.venv" ]; then
                python3 -m venv "$SF_DIR/.venv" || python -m venv "$SF_DIR/.venv" || true
              fi
              if [ -x "$SF_DIR/.venv/bin/pip" ]; then
                "$SF_DIR/.venv/bin/pip" install --upgrade pip || true
                if [ -f "$SF_DIR/requirements.txt" ]; then
                  "$SF_DIR/.venv/bin/pip" install -r "$SF_DIR/requirements.txt" || true
                fi
              fi
            fi

            echo "Ensuring stable server path via symlink..."
            mkdir -p ${BASE_DIR}/server
            # Symlink /var/www/anatscrawler/server -> /var/www/anatscrawler/current/server
            if [ -L "${BASE_DIR}/server" ]; then
              rm -f "${BASE_DIR}/server"
            fi
            ln -sfn "${CURRENT_DIR}/server" "${BASE_DIR}/server"

            # Symlink /var/www/anatscrawler/client -> /var/www/anatscrawler/current/client
            if [ -L "${BASE_DIR}/client" ]; then
              rm -f "${BASE_DIR}/client"
            fi
            ln -sfn "${CURRENT_DIR}/client" "${BASE_DIR}/client"

            echo "Listing deployment contents for diagnostics..."
            if [ -f "${BASE_DIR}/anatscrawler-release.tar.gz" ]; then
              tar -tzf "${BASE_DIR}/anatscrawler-release.tar.gz" | head -n 200 || true
            else
              echo "(artifact already extracted/removed)"
            fi
            echo "--- CURRENT_DIR contents ---"; ls -la "${CURRENT_DIR}" || true
            echo "--- server dir ---"; ls -la "${CURRENT_DIR}/server" || true

            echo "Writing .env with production secrets..."
            cat > .env <<EOF
            NODE_ENV=production
            PORT=${APP_PORT:-5000}
            HOST=0.0.0.0
            # Search/DB/Cache services (set via GitHub Secrets)
            ELASTICSEARCH_URL=${ELASTICSEARCH_URL:-http://192.168.1.110:9200}
            MONGODB_URL=${MONGODB_URL:-mongodb://192.168.1.110:27017/anat_security}
            REDIS_URL=${REDIS_URL:-redis://192.168.1.110:6379}
            # API base for frontend (client may ignore at runtime)
            VITE_API_URL=${VITE_API_URL:-/api}
            # Auth secrets
            JWT_SECRET=${JWT_SECRET}
            COOKIE_SECRET=${COOKIE_SECRET}
            # Optional MISP integration
            MISP_URL=${MISP_URL}
            MISP_API_KEY=${MISP_API_KEY}
            MISP_VERIFY_TLS=${MISP_VERIFY_TLS}
            MISP_TIMEOUT_MS=${MISP_TIMEOUT_MS}
            # SpiderFoot integration
            SPIDERFOOT_HOST=127.0.0.1
            SPIDERFOOT_PORT=5001
            SPIDERFOOT_DOCROOT=/osint
            SPIDERFOOT_DIR=./server/spiderfoot-4.0
            SPIDERFOOT_NO_VENV=0
            # Web
            CORS_ORIGIN=https://horus.anatsecurity.fr
            MAX_CONCURRENT_SCANS=10
            EOF

            echo "Starting PM2 via ecosystem.config.cjs..."
            pm2 startOrReload ecosystem.config.cjs || pm2 start ecosystem.config.cjs
            pm2 save

            echo "Waiting for app to stabilize..."
            for i in {1..30}; do
              if curl -fsS -m 5 http://127.0.0.1:5000/health > /dev/null; then
                echo "App healthy on 127.0.0.1:5000"; break
              fi
              sleep 1
            done

            echo "Verifying API health..."
            API_OK=0
            for i in {1..30}; do
              if curl -fsS -m 5 http://127.0.0.1:5000/health > /dev/null; then
                API_OK=1; echo "API health check OK"; break
              fi
              sleep 1
            done
            if [ "$API_OK" -ne 1 ]; then
              echo "API health check failed; showing logs"
              pm2 logs anatscrawler --lines 120 --nostream || true
              exit 1
            fi

            echo "Check SpiderFoot proxy health (requires app to auto-start it)..."
            OSINT_OK=0
            for i in {1..60}; do
              # Health behind auth is not public; just hit unauthenticated to trigger start
              if curl -fsS -m 5 http://127.0.0.1:5000/osint/health > /dev/null; then
                OSINT_OK=1; echo "SpiderFoot proxy responded"; break
              fi
              sleep 1
            done
            if [ "$OSINT_OK" -ne 1 ]; then
              echo "SpiderFoot proxy did not respond yet (may require first authenticated request). Continuing..."
            fi

      - name: Final status
        if: always()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 3m
          script: |
            echo "PM2 status:"
            pm2 status anatscrawler || true
            echo "External health (if DNS/SSL configured):"
            curl -fsS -m 10 https://horus.anatsecurity.fr/health || true
