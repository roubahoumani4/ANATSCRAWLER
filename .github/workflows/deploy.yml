
name: CI/CD → VM

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build:client

      - name: Build server
        run: npm run build:server

      - name: Prepare artifacts
        run: |
          mkdir -p out/client/dist
          cp -r dist/* out/ || true
          cp -r client/dist/* out/client/dist/ || true
          cp -r server/dist out/server-dist || true
          cp -r server out/   # Ensure the entire server directory (including spiderfoot_wrapper.py and spiderfoot/) is deployed
          cp package.json out/
          cp package-lock.json out/
          cp ecosystem.config.cjs out/
          cp .env.example out/ || true
          mkdir -p out/scripts
          cp -r scripts/install-maigret.sh out/scripts/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: out

      - name: Prepare deploy directory
        run: |
          mkdir -p deploy
          rsync -a --delete out/ deploy/

      - name: Sync build artifacts to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy/**"
          target: /var/www/anatscrawler/app
          rm: false
          strip_components: 1

      - name: Deploy & reload on VM
        uses: appleboy/ssh-action@v1.0.0
        env:
          APP_PORT: ${{ secrets.APP_PORT }}
          ELASTICSEARCH_URL: ${{ secrets.ELASTICSEARCH_URL }}
          MONGODB_URL: ${{ secrets.MONGODB_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          MISP_URL: ${{ secrets.MISP_URL }}
          MISP_API_KEY: ${{ secrets.MISP_API_KEY }}
          MISP_VERIFY_TLS: ${{ secrets.MISP_VERIFY_TLS }}
          MISP_TIMEOUT_MS: ${{ secrets.MISP_TIMEOUT_MS }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/anatscrawler/app
            echo "--- Directory contents ---"
            ls -la
            echo "--- Node version ---"
            node -v
            echo "--- NPM version ---"
            npm -v
            echo "--- package.json ---"
            cat package.json
            echo "--- package-lock.json ---"
            cat package-lock.json
            # Install production dependencies only
            npm ci --omit=dev
            # Install Maigret and dependencies for Threat Intelligence feature
            chmod +x scripts/install-maigret.sh
            bash scripts/install-maigret.sh
            # Ensure PM2 is available before using it
            if ! command -v pm2 >/dev/null 2>&1; then
              npm install -g pm2
            fi
            # Install Python dependencies for Spiderfoot
            # Always use maigret-venv for Python dependencies
            if [ ! -d "maigret-venv" ]; then
              python3 -m venv maigret-venv
            fi
            source maigret-venv/bin/activate
            pip install --upgrade pip
            # Ensure required Python deps for SpiderFoot integration
            pip install networkx
            pip install --upgrade beautifulsoup4
            deactivate
            # Recreate .env before starting pm2
            cat > .env <<EOF
            NODE_ENV=production
            PORT=${APP_PORT}
            HOST=0.0.0.0
            ELASTICSEARCH_URL=${ELASTICSEARCH_URL}
            MONGODB_URL=${MONGODB_URL}
            REDIS_URL=${REDIS_URL}
            VITE_API_URL=/api
            JWT_SECRET=${JWT_SECRET}
            COOKIE_SECRET=${COOKIE_SECRET}
            MISP_URL=${MISP_URL}
            MISP_API_KEY=${MISP_API_KEY}
            MISP_VERIFY_TLS=${MISP_VERIFY_TLS}
            MISP_TIMEOUT_MS=${MISP_TIMEOUT_MS}
            EOF
            chmod 600 .env
            # Start or reload with ecosystem only
            pm2 delete anatscrawler || true
            pm2 start ecosystem.config.cjs --env production
            pm2 save

            # Ensure SpiderFoot runtime preconditions
            echo "--- Ensuring /var/www/anatscrawler ownership (best-effort) ---"
            if [ "$(id -u)" -eq 0 ]; then
              chown -R $(whoami):$(whoami) /var/www/anatscrawler >/dev/null 2>&1 || true
            else
              echo "Not root; skipping chown to avoid noisy 'Operation not permitted' errors"
            fi

            echo "--- Ensuring modules symlink ---"
            if [ ! -L "/var/www/anatscrawler/modules" ]; then
              ln -s /var/www/anatscrawler/app/server/spiderfoot/modules /var/www/anatscrawler/modules >/dev/null 2>&1 || true
            fi

            echo "--- Connectivity sanity checks ---"
            curl -s https://example.com >/dev/null || true

            echo "--- SpiderFoot health check ---"
            sleep 2
            curl -s http://127.0.0.1:${APP_PORT}/api/spiderfoot/health || true
            echo
            echo "--- SpiderFoot modules ---"
            curl -s http://127.0.0.1:${APP_PORT}/api/spiderfoot/modules || true
            echo
            echo "--- SpiderFoot scanlist ---"
            curl -s http://127.0.0.1:${APP_PORT}/api/spiderfoot/scanlist || true
      # All dependencies should be pinned in package.json; avoid modifying deps post-deploy
