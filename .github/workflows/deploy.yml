name: Production Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Verify jspdf installation
        run: |
          if npm list jspdf > /dev/null 2>&1; then
            echo "✅ jspdf is installed"
            npm list jspdf
          else
            echo "❌ jspdf not found, installing..."
            npm install jspdf
          fi

      - name: Build (client + server)
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.js
          test -d client/dist

      - name: Package release
        run: |
          mkdir -p .release
          cp -r dist .release/dist
          mkdir -p .release/client
          cp -r client/dist .release/client/dist
          # Include server files
          mkdir -p .release/server
          # Copy only necessary server directories
          cp -r server/config server/lib server/middleware server/models server/routes server/services server/types server/utils server/scripts .release/server/
          # Embedded OSINT engine integration removed from release packaging
          cp package.json .release/
          if [ -f package-lock.json ]; then cp package-lock.json .release/; fi
          cp ecosystem.config.cjs .release/
          tar -C .release -czf anatscrawler-release.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: anatscrawler-release
          path: anatscrawler-release.tar.gz
          if-no-files-found: error

  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Prepare remote base directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 5m
          script: |
            set -e
            mkdir -p /var/www/anatscrawler/current /var/www/anatscrawler/logs /var/www/anatscrawler/data
            # Ownership not required if deploy user already owns /var/www/anatscrawler

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: anatscrawler-release
          path: .

      - name: Upload package to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: "anatscrawler-release.tar.gz"
          target: "/var/www/anatscrawler/"

      - name: Activate release (fast) and restart PM2
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Core app secrets and backing services
          APP_PORT: ${{ secrets.APP_PORT }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          MONGODB_URL: ${{ secrets.MONGODB_URL }}
          ELASTICSEARCH_URL: ${{ secrets.ELASTICSEARCH_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          # LinkedIn Scraper
          LINKEDIN_SESSION_COOKIE: ${{ secrets.LINKEDIN_SESSION_COOKIE }}
          # Optional MISP integration
          MISP_URL: ${{ secrets.MISP_URL }}
          MISP_API_KEY: ${{ secrets.MISP_API_KEY }}
          MISP_VERIFY_TLS: ${{ secrets.MISP_VERIFY_TLS }}
          MISP_TIMEOUT_MS: ${{ secrets.MISP_TIMEOUT_MS }}
          # Frontend runtime hint (not strictly required)
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 6m
          envs: APP_PORT,JWT_SECRET,COOKIE_SECRET,MONGODB_URL,ELASTICSEARCH_URL,REDIS_URL,LINKEDIN_SESSION_COOKIE,MISP_URL,MISP_API_KEY,MISP_VERIFY_TLS,MISP_TIMEOUT_MS,VITE_API_URL
          script: |
            set -e
            BASE_DIR=/var/www/anatscrawler
            RELEASE_TGZ=${BASE_DIR}/anatscrawler-release.tar.gz
            CURRENT_DIR=${BASE_DIR}/current
            SHARED_DATA=${BASE_DIR}/data

            echo "Preparing directories..."
            umask 022
            mkdir -p "${CURRENT_DIR}" "${SHARED_DATA}" "${SHARED_DATA}/backups" "${BASE_DIR}/logs"
            chmod -R 755 "${SHARED_DATA}" "${BASE_DIR}/logs" || true
            mkdir -p /var/www/anatscrawler/logs || true
            chmod 755 /var/www/anatscrawler/logs || true
            echo "Checking Node.js..."
            if ! command -v node >/dev/null 2>&1; then
              echo "Node.js not found. Skipping privileged installation (no sudo required). Please preinstall Node.js >= 20."
            fi

            # Ensure PM2 is available (try user-level first)
            if ! command -v pm2 >/dev/null 2>&1; then
              npm i -g pm2 || { echo "PM2 global install failed without sudo; attempting with sudo if available"; command -v sudo >/dev/null 2>&1 && sudo npm i -g pm2 || true; }
            fi

            echo "Stopping PM2 app (if running)..."
            pm2 stop anatscrawler || true

            echo "Extracting release into current..."
            rm -rf "${CURRENT_DIR:?}"/*
            tar -xzf "${RELEASE_TGZ}" -C "${CURRENT_DIR}"
            rm -f "${RELEASE_TGZ}"

            cd "${CURRENT_DIR}"

            echo "Skipping OS-level package installation (no sudo). Assuming runtime deps present."

            echo "Ensuring nmap is available on the host (used by server/scripts/osint_pro.py)"
            if command -v nmap >/dev/null 2>&1; then
              echo "✅ nmap already installed"
            else
              echo "nmap not found. Attempting to install nmap if sudo is available..."
              if command -v sudo >/dev/null 2>&1; then
                sudo apt-get update -y && sudo apt-get install -y nmap || echo "Warning: sudo apt-get install nmap failed"
              else
                # Try non-sudo install (will fail on most systems without privileges)
                apt-get update -y && apt-get install -y nmap || echo "Warning: apt-get install nmap failed or not permitted (no sudo)"
              fi
            fi

            echo "Installing runtime dependencies (prod only)..."
            if [ -f package-lock.json ]; then
              npm ci --omit=dev --no-audit --no-fund
            else
              npm install --omit=dev --no-audit --no-fund
            fi

            echo "Verifying jspdf installation..."
            if npm list jspdf > /dev/null 2>&1; then
              echo "✅ jspdf is installed in production"
              npm list jspdf
            else
              echo "⚠️  jspdf not found, installing..."
              npm install jspdf --no-audit --no-fund
            fi

            # Ensure scripts directory is available and executable
            echo "Deploying helper scripts..."
            mkdir -p ${BASE_DIR}/scripts
            if [ -d "${CURRENT_DIR}/server/scripts" ]; then
              cp -r "${CURRENT_DIR}/server/scripts/." "${BASE_DIR}/scripts/"
              chmod -R 755 "${BASE_DIR}/scripts"
              echo "Scripts copied to ${BASE_DIR}/scripts and made executable"
            else
              echo "No server/scripts directory found in release"
            fi

            # Create or update a dedicated virtualenv for helper scripts to avoid system pip
            VENV_DIR=${BASE_DIR}/.venv
            echo "Ensuring scripts virtualenv at ${VENV_DIR}..."
            if [ ! -d "${VENV_DIR}" ]; then
              python3 -m venv "${VENV_DIR}" || { echo "Failed to create scripts venv"; }
            fi
            if [ -x "${VENV_DIR}/bin/pip" ]; then
              echo "Upgrading pip in venv..."
              "${VENV_DIR}/bin/pip" install --upgrade pip setuptools wheel || true
              # Install script requirements if provided
              if [ -f "${CURRENT_DIR}/server/scripts/requirements.txt" ]; then
                echo "Installing script requirements into venv..."
                "${VENV_DIR}/bin/pip" install -r "${CURRENT_DIR}/server/scripts/requirements.txt" || echo "Warning: some script requirements failed to install"
              fi
            else
              echo "Warning: venv pip not found at ${VENV_DIR}/bin/pip"
            fi

            # Symlink /var/www/anatscrawler/server -> /var/www/anatscrawler/current/server
            echo "Ensuring stable server path via symlink..."
            mkdir -p ${BASE_DIR}/server
            if [ -L "${BASE_DIR}/server" ]; then
              rm -f "${BASE_DIR}/server"
            fi
            ln -sfn "${CURRENT_DIR}/server" "${BASE_DIR}/server"

            # Symlink /var/www/anatscrawler/client -> /var/www/anatscrawler/current/client
            if [ -L "${BASE_DIR}/client" ]; then
              rm -f "${BASE_DIR}/client"
            fi
            ln -sfn "${CURRENT_DIR}/client" "${BASE_DIR}/client"

            echo "Listing deployment contents for diagnostics..."
            if [ -f "${BASE_DIR}/anatscrawler-release.tar.gz" ]; then
              tar -tzf "${BASE_DIR}/anatscrawler-release.tar.gz" | head -n 200 || true
            else
              echo "(artifact already extracted/removed)"
            fi
            echo "--- CURRENT_DIR contents ---"; ls -la "${CURRENT_DIR}" || true
            echo "--- server dir ---"; ls -la "${CURRENT_DIR}/server" || true

            echo "Writing .env with production secrets..."
            # Create .env file for runtime
            cat > .env << 'EOF'
            NODE_ENV=production
            HOST=0.0.0.0
            PORT=5000
            # Database and Services
            MONGODB_URL=${MONGODB_URL}
            ELASTICSEARCH_URL=${ELASTICSEARCH_URL}
            REDIS_URL=${REDIS_URL}
            # Security
            JWT_SECRET=${JWT_SECRET}
            COOKIE_SECRET=${COOKIE_SECRET}
            # LinkedIn Scraper
            LINKEDIN_SESSION_COOKIE=${LINKEDIN_SESSION_COOKIE:-}
            # Optional MISP Integration
            MISP_URL=${MISP_URL:-}
            MISP_API_KEY=${MISP_API_KEY:-}
            MISP_VERIFY_TLS=${MISP_VERIFY_TLS:-true}
            MISP_TIMEOUT_MS=${MISP_TIMEOUT_MS:-30000}
            # Embedded OSINT engine integration removed; no engine-specific env vars set
            # CORS Configuration
            CORS_ORIGIN=https://horus.anatsecurity.fr
            MAX_CONCURRENT_SCANS=10
            # Production Optimization
            CLUSTER_MODE=true
            WORKER_PROCESSES=2
            # Debug flag for troubleshooting
            DEBUG_STARTUP=true
            EOF

            echo "Environment configured. Starting PM2..."

            echo "Starting PM2 via ecosystem.config.cjs..."
            cd "${CURRENT_DIR}"
            ls -la ecosystem.config.cjs || echo "ecosystem.config.cjs not found in current directory"
            pwd
            pm2 startOrReload ./ecosystem.config.cjs || pm2 start ./ecosystem.config.cjs
            pm2 save

            echo "Waiting for PM2 to start app..."
            sleep 5
            pm2 list
            pm2 logs anatscrawler --lines 20 --nostream || true

            echo "Waiting for app to stabilize..."
            API_READY=0
            for i in {1..60}; do
              echo "Health check attempt $i/60..."
              if curl -fsS --connect-timeout 10 -m 10 http://127.0.0.1:5000/health > /dev/null 2>&1; then
                echo "✅ App healthy on 127.0.0.1:5000"
                API_READY=1
                break
              fi
              if curl -fsS --connect-timeout 10 -m 10 http://0.0.0.0:5000/health > /dev/null 2>&1; then
                echo "✅ App healthy on 0.0.0.0:5000"
                API_READY=1
                break
              fi
              echo "⏳ App not ready yet, waiting..."
              sleep 2
            done

            if [ "$API_READY" -ne 1 ]; then
              echo "❌ API health check failed after 2 minutes. Showing PM2 status and logs..."
              pm2 list
              pm2 logs anatscrawler --lines 50 --nostream || true
              echo "Checking if port 5000 is in use..."
              netstat -tulpn 2>/dev/null | grep :5000 || ss -tulpn 2>/dev/null | grep :5000 || echo "Port 5000 not found in netstat/ss"
              echo "Testing basic network connectivity..."
              curl -v --connect-timeout 5 http://127.0.0.1:5000/health || true
              exit 1
            fi
      

      - name: Final status
        if: always()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 4m
          script: |
            echo "PM2 status:"
            pm2 status anatscrawler || true
            echo "External health (if DNS/SSL configured):"
            curl -fsS -m 10 https://horus.anatsecurity.fr/health || true
