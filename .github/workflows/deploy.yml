name: Production Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Typecheck (TypeScript)
        run: npx tsc --noEmit

      - name: Build (client + server)
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.js
          test -d client/dist

      - name: Package release
        run: |
          mkdir -p .release
          cp -r dist .release/dist
          mkdir -p .release/client
          cp -r client/dist .release/client/dist
          # Include server files
          mkdir -p .release/server
          # Copy only necessary server directories
          cp -r server/config server/lib server/middleware server/models server/routes server/services server/types server/utils .release/server/
          # Include SpiderFoot integration code
          mkdir -p .release/server/spiderfoot-4.0
          cp -r server/spiderfoot-4.0 .release/server/
          # Ensure production requirements are included
          if [ -f server/spiderfoot-4.0/requirements-production.txt ]; then
            cp server/spiderfoot-4.0/requirements-production.txt .release/server/spiderfoot-4.0/
          fi
          cp package.json .release/
          if [ -f package-lock.json ]; then cp package-lock.json .release/; fi
          cp ecosystem.config.cjs .release/
          tar -C .release -czf anatscrawler-release.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: anatscrawler-release
          path: anatscrawler-release.tar.gz
          if-no-files-found: error

  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Prepare remote base directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 5m
          script: |
            set -e
            mkdir -p /var/www/anatscrawler/current /var/www/anatscrawler/logs /var/www/anatscrawler/data
            # Ownership not required if deploy user already owns /var/www/anatscrawler

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: anatscrawler-release
          path: .

      - name: Upload package to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: "anatscrawler-release.tar.gz"
          target: "/var/www/anatscrawler/"

      - name: Activate release and restart PM2
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Core app secrets and backing services
          APP_PORT: ${{ secrets.APP_PORT }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          MONGODB_URL: ${{ secrets.MONGODB_URL }}
          ELASTICSEARCH_URL: ${{ secrets.ELASTICSEARCH_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          # Optional MISP integration
          MISP_URL: ${{ secrets.MISP_URL }}
          MISP_API_KEY: ${{ secrets.MISP_API_KEY }}
          MISP_VERIFY_TLS: ${{ secrets.MISP_VERIFY_TLS }}
          MISP_TIMEOUT_MS: ${{ secrets.MISP_TIMEOUT_MS }}
          # Frontend runtime hint (not strictly required)
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 10m
          envs: APP_PORT,JWT_SECRET,COOKIE_SECRET,MONGODB_URL,ELASTICSEARCH_URL,REDIS_URL,MISP_URL,MISP_API_KEY,MISP_VERIFY_TLS,MISP_TIMEOUT_MS,VITE_API_URL
          script: |
            set -e
            BASE_DIR=/var/www/anatscrawler
            RELEASE_TGZ=${BASE_DIR}/anatscrawler-release.tar.gz
            CURRENT_DIR=${BASE_DIR}/current
            SHARED_DATA=${BASE_DIR}/data

            echo "Preparing directories..."
            umask 022
            mkdir -p "${CURRENT_DIR}" "${SHARED_DATA}" "${SHARED_DATA}/backups" "${BASE_DIR}/logs"
            chmod -R 755 "${SHARED_DATA}" "${BASE_DIR}/logs" || true
            mkdir -p /var/www/anatscrawler/logs || true
            chmod 755 /var/www/anatscrawler/logs || true
            echo "Checking Node.js..."
            if ! command -v node >/dev/null 2>&1; then
              echo "Node.js not found. Skipping privileged installation (no sudo required). Please preinstall Node.js >= 20."
            fi

            # Ensure PM2 is available (try user-level first)
            if ! command -v pm2 >/dev/null 2>&1; then
              npm i -g pm2 || { echo "PM2 global install failed without sudo; attempting with sudo if available"; command -v sudo >/dev/null 2>&1 && sudo npm i -g pm2 || true; }
            fi

            echo "Stopping PM2 app (if running)..."
            pm2 stop anatscrawler || true

            echo "Extracting release into current..."
            rm -rf "${CURRENT_DIR:?}"/*
            tar -xzf "${RELEASE_TGZ}" -C "${CURRENT_DIR}"
            rm -f "${RELEASE_TGZ}"

            cd "${CURRENT_DIR}"

            echo "Skipping OS-level package installation (no sudo). Assuming runtime deps present."

            echo "Installing runtime dependencies (prod only)..."
            if [ -f package-lock.json ]; then
              npm ci --omit=dev --no-audit --no-fund
            else
              npm install --omit=dev --no-audit --no-fund
            fi

            echo "Preparing SpiderFoot runtime (venv + requirements)..."
            SF_DIR="${CURRENT_DIR}/server/spiderfoot-4.0"
            if [ -d "$SF_DIR" ]; then
              echo "🕷️ Setting up SpiderFoot OSINT Engine..."
              
              # Ensure system dependencies are available
              echo "Checking system dependencies..."
              if command -v apt-get >/dev/null 2>&1; then
                # Ubuntu/Debian
                echo "Installing system packages for SpiderFoot..."
                sudo apt-get update && sudo apt-get install -y \
                  python3 python3-venv python3-pip python3-dev \
                  libxml2-dev libxslt1-dev libffi-dev libssl-dev \
                  build-essential pkg-config || echo "⚠️ Some system packages failed to install"
              elif command -v yum >/dev/null 2>&1; then
                # CentOS/RHEL/Rocky
                echo "Installing system packages for SpiderFoot..."
                sudo yum install -y \
                  python3 python3-venv python3-pip python3-devel \
                  libxml2-devel libxslt-devel libffi-devel openssl-devel \
                  gcc gcc-c++ make pkgconfig || echo "⚠️ Some system packages failed to install"
              else
                echo "⚠️ Unknown package manager, assuming dependencies are pre-installed"
              fi
              
              # Ensure Python is available
              if ! command -v python3 >/dev/null 2>&1; then
                echo "❌ Python3 not found after installation attempt"
                exit 1
              fi
              
              echo "🐍 Found Python: $(python3 --version)"
              
              # Create or recreate venv for clean deployment
              echo "Setting up fresh Python virtual environment..."
              cd "$SF_DIR"
              rm -rf .venv
              python3 -m venv .venv || {
                echo "❌ Failed to create virtual environment"
                exit 1
              }
              
              # Verify venv was created successfully
              if [ ! -x ".venv/bin/pip" ]; then
                echo "❌ Virtual environment pip not found"
                exit 1
              fi
              
              echo "📦 Installing SpiderFoot dependencies..."
              
              # Upgrade pip and essential tools first
              ".venv/bin/pip" install --upgrade pip setuptools wheel || {
                echo "❌ Failed to upgrade pip"
                exit 1
              }
              
              # Install core dependencies with specific compatibility versions
              echo "Installing core SpiderFoot dependencies..."
              ".venv/bin/pip" install \
                "cherrypy>=18.6.0,<19" \
                "cherrypy-cors>=1.6,<2" \
                "requests>=2.25.0,<3" \
                "beautifulsoup4>=4.9.0,<5" \
                "dnspython>=2.1.0,<3" \
                "netaddr>=0.8.0,<1" \
                "cryptography>=3.4.0,<4" || {
                echo "❌ Failed to install core dependencies"
                exit 1
              }
              
              # Install PyYAML with specific handling for Python 3.13 compatibility
              echo "Installing PyYAML with compatibility fixes..."
              ".venv/bin/pip" install "pyyaml>=6.0" || {
                echo "⚠️ Latest PyYAML failed, trying 5.4.1..."
                ".venv/bin/pip" install "pyyaml==5.4.1" || {
                  echo "⚠️ PyYAML installation failed, installing wheel directly..."
                  ".venv/bin/pip" install --only-binary=all "pyyaml>=5.4" || {
                    echo "⚠️ PyYAML installation completely failed, continuing without YAML support..."
                  }
                }
              }
              
              # Install XML processing (with fallback for compatibility)
              echo "Installing XML processing dependencies..."
              ".venv/bin/pip" install "lxml>=4.6,<5" || {
                echo "⚠️ lxml failed, trying with build dependencies..."
                # Try installing build dependencies if available
                if command -v apt-get >/dev/null 2>&1; then
                  sudo apt-get install -y libxml2-dev libxslt1-dev || echo "Could not install build deps"
                fi
                ".venv/bin/pip" install "lxml>=4.6,<5" || {
                  echo "⚠️ lxml still failed, installing alternative..."
                  ".venv/bin/pip" install "beautifulsoup4[lxml]" || {
                    echo "⚠️ XML processing libraries failed, HTML parsing will be limited"
                  }
                }
              }
              
              # Install additional useful dependencies
              echo "Installing additional SpiderFoot dependencies..."
              ".venv/bin/pip" install \
                "openpyxl>=3.0.0" \
                "networkx>=2.5" \
                "phonenumbers>=8.12.0" \
                "pyopenssl>=20.0.0" \
                "publicsuffixlist>=0.9.0" \
                "python-whois>=0.7.0" \
                "ipwhois>=1.2.0" \
                "pysocks>=1.7.0" || {
                echo "⚠️ Some optional dependencies failed, continuing..."
              }
              
              # Use production requirements if available, with fallback handling
              if [ -f "requirements-production.txt" ]; then
                echo "Installing from production-optimized requirements..."
                ".venv/bin/pip" install -r requirements-production.txt || {
                  echo "⚠️ Some production requirements failed, continuing with core packages..."
                }
              elif [ -f "requirements.txt" ]; then
                echo "Installing from standard requirements..."
                ".venv/bin/pip" install -r requirements.txt || {
                  echo "⚠️ Some requirements failed, continuing with core packages..."
                }
              fi
              
              # Verify critical imports work
              echo "🧪 Verifying SpiderFoot dependencies..."
              ".venv/bin/python" -c "import cherrypy; print('✅ CherryPy OK')" || {
                echo "❌ CherryPy import failed"
                exit 1
              }
              ".venv/bin/python" -c "import requests; print('✅ Requests OK')" || {
                echo "❌ Requests import failed"
                exit 1
              }
              ".venv/bin/python" -c "import bs4; print('✅ BeautifulSoup4 OK')" || {
                echo "❌ BeautifulSoup4 import failed"
                exit 1
              }
              ".venv/bin/python" -c "import dns.resolver; print('✅ DNS resolver OK')" || {
                echo "❌ DNS resolver import failed"
                exit 1
              }
              ".venv/bin/python" -c "import netaddr; print('✅ NetAddr OK')" || {
                echo "❌ NetAddr import failed"
                exit 1
              }
              echo "✅ All core dependencies verified successfully"
              
              # Run comprehensive installation verification
              if [ -f "verify_installation.py" ]; then
                echo "Running comprehensive SpiderFoot verification..."
                ".venv/bin/python" verify_installation.py || {
                  echo "⚠️ SpiderFoot verification found issues, but continuing deployment..."
                  echo "Some optional features may not work properly"
                }
              fi
              
              # Ensure SpiderFoot data directories exist with proper permissions
              echo "Setting up SpiderFoot data directories..."
              mkdir -p "${SHARED_DATA}/spiderfoot" "${SHARED_DATA}/spiderfoot/cache" "${SHARED_DATA}/spiderfoot/logs"
              chmod -R 755 "${SHARED_DATA}/spiderfoot" || true
              
              # Create empty passwd file to disable authentication
              echo "Configuring SpiderFoot authentication..."
              touch "${SHARED_DATA}/spiderfoot/passwd"
              chmod 644 "${SHARED_DATA}/spiderfoot/passwd"
              
              # Test SpiderFoot functionality
              echo "🧪 Testing SpiderFoot functionality..."
              cd "$SF_DIR"
              if [ -f "sf.py" ]; then
                # Test help command
                ".venv/bin/python" sf.py --help > /dev/null 2>&1 && {
                  echo "✅ SpiderFoot help command works"
                } || {
                  echo "❌ SpiderFoot test failed"
                  echo "🔍 Debugging SpiderFoot startup..."
                  ".venv/bin/python" sf.py --help 2>&1 | head -20 || true
                  echo "🔍 Python path and modules:"
                  ".venv/bin/python" -c "import sys; print('Python executable:', sys.executable)"
                  ls -la sf.py
                  exit 1
                }
                
                # Test basic module imports
                ".venv/bin/python" -c "import sys; sys.path.insert(0, '.'); import spiderfoot; print('✅ SpiderFoot module OK')" || {
                  echo "⚠️ SpiderFoot module import failed, checking files..."
                  ls -la *.py | head -10
                }
                
                echo "✅ SpiderFoot OSINT Engine setup completed successfully"
              else
                echo "❌ SpiderFoot main script not found"
                echo "🔍 Contents of SpiderFoot directory:"
                ls -la | head -20
                exit 1
              fi
            else
              echo "⚠️ SpiderFoot directory not found at $SF_DIR"
              echo "OSINT functionality will be limited"
            fi

            echo "Ensuring stable server path via symlink..."
            mkdir -p ${BASE_DIR}/server
            # Symlink /var/www/anatscrawler/server -> /var/www/anatscrawler/current/server
            if [ -L "${BASE_DIR}/server" ]; then
              rm -f "${BASE_DIR}/server"
            fi
            ln -sfn "${CURRENT_DIR}/server" "${BASE_DIR}/server"

            # Symlink /var/www/anatscrawler/client -> /var/www/anatscrawler/current/client
            if [ -L "${BASE_DIR}/client" ]; then
              rm -f "${BASE_DIR}/client"
            fi
            ln -sfn "${CURRENT_DIR}/client" "${BASE_DIR}/client"

            echo "Listing deployment contents for diagnostics..."
            if [ -f "${BASE_DIR}/anatscrawler-release.tar.gz" ]; then
              tar -tzf "${BASE_DIR}/anatscrawler-release.tar.gz" | head -n 200 || true
            else
              echo "(artifact already extracted/removed)"
            fi
            echo "--- CURRENT_DIR contents ---"; ls -la "${CURRENT_DIR}" || true
            echo "--- server dir ---"; ls -la "${CURRENT_DIR}/server" || true

            echo "Writing .env with production secrets..."
            # Create .env file for runtime
            cat > .env << 'EOF'
            NODE_ENV=production
            HOST=0.0.0.0
            PORT=5000
            # Database and Services
            MONGODB_URL=${MONGODB_URL}
            ELASTICSEARCH_URL=${ELASTICSEARCH_URL}
            REDIS_URL=${REDIS_URL}
            # Security
            JWT_SECRET=${JWT_SECRET}
            COOKIE_SECRET=${COOKIE_SECRET}
            # Optional MISP Integration
            MISP_URL=${MISP_URL:-}
            MISP_API_KEY=${MISP_API_KEY:-}
            MISP_VERIFY_TLS=${MISP_VERIFY_TLS:-true}
            MISP_TIMEOUT_MS=${MISP_TIMEOUT_MS:-30000}
            # SpiderFoot OSINT Engine (localhost binding for security)
            SPIDERFOOT_HOST=127.0.0.1
            SPIDERFOOT_PORT=5001
            SPIDERFOOT_DIR=/var/www/anatscrawler/current/server/spiderfoot-4.0
            SPIDERFOOT_DATA=/var/www/anatscrawler/data/spiderfoot
            SPIDERFOOT_CACHE=/var/www/anatscrawler/data/spiderfoot/cache
            SPIDERFOOT_LOGS=/var/www/anatscrawler/data/spiderfoot/logs
            SPIDERFOOT_DB=/var/www/anatscrawler/data/spiderfoot/spiderfoot.db
            # CORS Configuration
            CORS_ORIGIN=https://horus.anatsecurity.fr
            MAX_CONCURRENT_SCANS=10
            # Production Optimization
            CLUSTER_MODE=true
            WORKER_PROCESSES=2
            # Debug flag for troubleshooting
            DEBUG_STARTUP=true
            EOF

            echo "Environment configured. Starting PM2..."

            echo "Starting PM2 via ecosystem.config.cjs..."
            cd "${CURRENT_DIR}"
            ls -la ecosystem.config.cjs || echo "ecosystem.config.cjs not found in current directory"
            pwd
            pm2 startOrReload ./ecosystem.config.cjs || pm2 start ./ecosystem.config.cjs
            pm2 save

            echo "Waiting for PM2 to start app..."
            sleep 5
            pm2 list
            pm2 logs anatscrawler --lines 20 --nostream || true

            echo "Waiting for app to stabilize..."
            API_READY=0
            for i in {1..60}; do
              echo "Health check attempt $i/60..."
              if curl -fsS --connect-timeout 10 -m 10 http://127.0.0.1:5000/health > /dev/null 2>&1; then
                echo "✅ App healthy on 127.0.0.1:5000"
                API_READY=1
                break
              fi
              if curl -fsS --connect-timeout 10 -m 10 http://0.0.0.0:5000/health > /dev/null 2>&1; then
                echo "✅ App healthy on 0.0.0.0:5000"
                API_READY=1
                break
              fi
              echo "⏳ App not ready yet, waiting..."
              sleep 2
            done

            if [ "$API_READY" -ne 1 ]; then
              echo "❌ API health check failed after 2 minutes. Showing PM2 status and logs..."
              pm2 list
              pm2 logs anatscrawler --lines 50 --nostream || true
              echo "Checking if port 5000 is in use..."
              netstat -tulpn 2>/dev/null | grep :5000 || ss -tulpn 2>/dev/null | grep :5000 || echo "Port 5000 not found in netstat/ss"
              echo "Testing basic network connectivity..."
              curl -v --connect-timeout 5 http://127.0.0.1:5000/health || true
              exit 1
            fi

            echo "Check SpiderFoot proxy health (requires app to auto-start it)..."
            OSINT_OK=0
            for i in {1..60}; do
              # Health behind auth is not public; just hit unauthenticated to trigger start
              if curl -fsS -m 5 http://127.0.0.1:5000/osint/health > /dev/null; then
                OSINT_OK=1; echo "SpiderFoot proxy responded"; break
              fi
              sleep 1
            done
            if [ "$OSINT_OK" -ne 1 ]; then
              echo "SpiderFoot proxy did not respond yet (may require first authenticated request). Continuing..."
            fi

      - name: Final status
        if: always()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 3m
          script: |
            echo "PM2 status:"
            pm2 status anatscrawler || true
            echo "External health (if DNS/SSL configured):"
            curl -fsS -m 10 https://horus.anatsecurity.fr/health || true
